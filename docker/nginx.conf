server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Vite build emits hashed asset filenames, so a long immutable cache is
    # safe for /assets. index.html must never be cached or the SPA would keep
    # booting an old bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Evaluation and demo generation can run long; do not cut them off.
        proxy_read_timeout 300s;
    }

    # Client-side routing: unknown paths are React routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
