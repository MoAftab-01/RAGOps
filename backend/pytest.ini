[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers --disable-warnings
markers =
    integration: needs a live PostgreSQL (and usually Redis); skipped automatically
    ml: needs numpy/scikit-learn, installed from requirements-ml.txt
filterwarnings =
    ignore::DeprecationWarning
