[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragops-sdk"
version = "0.1.0"
description = "Observability SDK for RAG and LLM applications: trace retrieval, generation, tokens and latency to a RAGOps server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RAGOps" }]
keywords = ["rag", "llm", "observability", "telemetry", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/ragops/ragops"
Repository = "https://github.com/ragops/ragops"

[tool.hatch.build.targets.wheel]
packages = ["ragops"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ANN", "RUF", "PL"]
ignore = [
    "ANN401",  # telemetry must accept arbitrary **kwargs
    "PLR0913", # the telemetry surface is intentionally wide
    "N818",    # exception names are descriptive, not Error-suffixed
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
